replicaCount: 1

image:
  repository: acrtest09.azurecr.io/mini-app
  tag: "1.0"
  pullPolicy: Always

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 50m
    memory: 64Mi

service:
  port: 80
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 50