{{- if .Values.gatewayApi.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mini-app-gateway
  labels:
    app: mini-app
spec:
  gatewayClassName: {{ .Values.gatewayApi.gatewayClassName }}
  listeners:
    - name: http
      port: {{ .Values.gatewayApi.listener.port }}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}

