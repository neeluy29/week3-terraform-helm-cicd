{{- if .Values.gatewayApi.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mini-app-route
  labels:
    app: mini-app
spec:
  parentRefs:
    - name: mini-app-gateway
  rules:
    - matches:
        - path:
            type: {{ .Values.gatewayApi.route.pathType }}
            value: {{ .Values.gatewayApi.route.path }}
      backendRefs:
        - name: mini-app-svc
          port: {{ .Values.service.port }}
{{- end }}
