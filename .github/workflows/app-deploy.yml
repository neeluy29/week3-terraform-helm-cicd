name: Build, Push, and Deploy mini-app

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'mini-app-chart/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name acrtest09

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        run: |
          docker buildx build --platform linux/arm64 -t acrtest09.azurecr.io/mini-app:1.0 --push ./app

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: |
          helm package mini-app-chart
          CHART_PACKAGE=$(ls -t mini-app-chart-*.tgz | head -n 1)
          echo "CHART_PACKAGE=$CHART_PACKAGE" >> "$GITHUB_ENV"

      - name: Deploy to AKS via command invoke
        run: |
          OUTPUT=$(az aks command invoke \
            --resource-group rg-aks-private \
            --name private-aks-demo \
            --command "helm upgrade --install mini-app-release $CHART_PACKAGE -n dev" \
            --file "$CHART_PACKAGE")
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qiE "error|exception|failed"; then
            echo "Deploy command failed inside the cluster"
            exit 1
          fi

      - name: Verify rollout
        run: |
          az aks command invoke \
            --resource-group rg-aks-private \
            --name private-aks-demo \
            --command "kubectl rollout status deployment/mini-app -n dev"